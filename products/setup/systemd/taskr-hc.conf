# herdr-kit hc backend (install.sh --herdr-backend hc): taskr drives
# herdr-core through the herdr0 shim, first on PATH.
[Service]
Environment=HERDR_KIT_BACKEND=hc
# hc's default socket (default session, no socket= in config.toml); %t is XDG_RUNTIME_DIR.
# Fixed here so taskr's guard and herdr0 check the same core; edit it with HC_SESSION or socket=.
Environment=HC_SOCKET=%t/herdr-core/default.sock
Environment=PATH=%h/.local/lib/herdr-kit/hc-bin:%h/.local/bin:/usr/local/bin:/usr/bin:/bin
